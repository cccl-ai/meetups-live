<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CCCL PNY2 — Thank You</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Georgia&family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e0e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .slide { width: 1280px; height: 720px; background: linear-gradient(135deg, #1a1a2e 0%, #16162b 50%, #1e1e38 100%); position: relative; overflow: hidden; font-family: 'Inter', sans-serif; }
  .slide::before { content: ''; position: absolute; top: -50%; right: -20%; width: 700px; height: 700px; background: radial-gradient(circle, rgba(196,130,95,0.06) 0%, transparent 70%); border-radius: 50%; }
  .slide::after { content: ''; position: absolute; bottom: -30%; left: -10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(168,164,160,0.04) 0%, transparent 70%); border-radius: 50%; }
  .watermark { position: absolute; right: -20px; bottom: 50px; font-family: Georgia, serif; font-weight: 700; font-size: 280px; line-height: 1; pointer-events: none; z-index: 0; user-select: none; }
  .watermark .cc { color: rgba(196,130,95,0.05); }
  .watermark .cl { color: rgba(232,228,221,0.04); }
  .content { position: relative; z-index: 1; padding: 40px 80px; height: 100%; display: flex; flex-direction: column; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
  .cccl-display { display: flex; flex-direction: column; align-items: flex-start; }
  .cccl-word-lg { font-family: Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1; }
  .cccl-word-lg .cc { color: #c4825f; }
  .cccl-word-lg .cl { color: #e8e4dd; }
  .cccl-underline { width: 100%; height: 2px; background: linear-gradient(90deg, #c4825f, rgba(196,130,95,0.1)); margin-top: 6px; border-radius: 1px; }
  .cccl-sub { font-size: 11px; letter-spacing: 2.5px; color: #a8a4a0; text-transform: uppercase; margin-top: 8px; }
  .main { flex: 1; display: flex; align-items: center; justify-content: center; gap: 90px; }
  .text-side { display: flex; flex-direction: column; max-width: 480px; }
  .title { font-family: Georgia, 'Times New Roman', serif; font-size: 76px; font-weight: 700; color: #e8e4dd; line-height: 1.1; margin-bottom: 16px; }
  .title .accent { color: #c4825f; }
  .divider { width: 60px; height: 3px; background: linear-gradient(90deg, #c4825f, rgba(196,130,95,0.3)); border-radius: 2px; margin-bottom: 20px; }
  .subtitle { font-size: 22px; font-weight: 300; color: #d4d0c8; line-height: 1.6; margin-bottom: 22px; }
  .handle { font-size: 20px; font-weight: 600; color: #c4825f; }
  .qr-side { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .qr-box { width: 480px; height: 480px; background: rgba(255,255,255,0.05); border: 1px solid rgba(196,130,95,0.3); border-radius: 20px; padding: 22px; display: flex; align-items: center; justify-content: center; }
  .qr-box img { width: 100%; height: 100%; }
  .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; margin-top: auto; }
  .cccl-logo { height: 56px; opacity: 0.85; }
  .url { font-size: 13px; color: #a8a4a0; }
</style>
</head>
<body>
<div class="slide">
  <div class="watermark"><span class="cc">CC</span><span class="cl">CL</span></div>
  <div class="content">
    <div class="top-bar">
      <div class="cccl-display">
        <div class="cccl-word-lg"><span class="cc">CC</span><span class="cl">CL</span></div>
        <div class="cccl-underline"></div>
        <div class="cccl-sub">Claude Code Meetups · In Your City</div>
      </div>
    </div>
    <div class="main">
      <div class="text-side">
        <div class="title">Thank <span class="accent">You!</span></div>
        <div class="divider"></div>
        <div class="subtitle">Stay connected with the community — events, workshops, and everything CCCL.</div>
        <div class="handle">cccl.ai</div>
      </div>
      <div class="qr-side">
        <div class="qr-box"><img src="qr_cccl.svg" alt="cccl.ai QR" /></div>
      </div>
    </div>
    <div class="bottom-bar">
      <img class="cccl-logo" src="cccl-badge-dark.svg" alt="CCCL" />
      <div class="url">Pondicherry &nbsp;·&nbsp; cccl.ai</div>
    </div>
  </div>
</div>
</body>
</html>
