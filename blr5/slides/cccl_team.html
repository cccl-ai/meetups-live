<style>
  @import url('https://fonts.googleapis.com/css2?family=Georgia&family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e0e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .slide { width: 1280px; height: 720px; background: linear-gradient(135deg, #1a1a2e 0%, #16162b 50%, #1e1e38 100%); position: relative; overflow: hidden; font-family: 'Inter', sans-serif; }
  .slide::before { content: ''; position: absolute; top: -45%; right: -15%; width: 720px; height: 720px; background: radial-gradient(circle, rgba(196,130,95,0.10) 0%, transparent 70%); border-radius: 50%; }
  .slide::after { content: ''; position: absolute; bottom: -30%; left: -10%; width: 520px; height: 520px; background: radial-gradient(circle, rgba(168,164,160,0.05) 0%, transparent 70%); border-radius: 50%; }
  .watermark { position: absolute; right: -10px; bottom: 30px; font-family: Georgia, serif; font-weight: 700; font-size: 300px; line-height: 1; pointer-events: none; z-index: 0; user-select: none; }
  .watermark .cc { color: rgba(196,130,95,0.06); }
  .watermark .cl { color: rgba(232,228,221,0.04); }
  .content { position: relative; z-index: 3; padding: 56px 80px 48px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .top-tag { font-size: 13px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: #a8a4a0; }
  .top-tag span { color: #c4825f; }
  .heading { font-family: Georgia, serif; font-size: 56px; font-weight: 700; color: #e8e4dd; margin-top: 26px; }
  .heading .accent { color: #c4825f; }
  .underline { width: 180px; height: 3px; background: linear-gradient(90deg, #c4825f, rgba(196,130,95,0.1)); margin-top: 14px; border-radius: 2px; }
  .team { display: flex; justify-content: space-between; gap: 40px; margin-top: 28px; flex: 1; }
  .member { display: flex; flex-direction: column; align-items: center; text-align: center; width: 240px; }
  .photo-ring { width: 200px; height: 200px; border-radius: 50%; padding: 5px; background: linear-gradient(135deg, #c4825f, rgba(196,130,95,0.15)); }
  .photo-ring img { width: 190px; height: 190px; border-radius: 50%; object-fit: cover; object-position: top; display: block; }
  .member-name { font-family: Georgia, serif; font-size: 24px; font-weight: 700; color: #e8e4dd; margin-top: 16px; line-height: 1.25; min-height: 62px; display: flex; align-items: center; justify-content: center; }
  .member-qr { display: flex; flex-direction: column; align-items: center; margin-top: 6px; }
  .member-qr img { width: 92px; height: 92px; border-radius: 8px; padding: 6px; background: #1a1a2e; border: 1px solid rgba(232,228,221,0.12); }
  .qr-label { font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: #a8a4a0; margin-top: 6px; }
  .member-role { font-size: 14px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: #c4825f; margin-top: 8px; }
  .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
  .cccl-logo { height: 52px; opacity: 0.85; }
  .url { font-size: 14px; color: #a8a4a0; }
</style>
