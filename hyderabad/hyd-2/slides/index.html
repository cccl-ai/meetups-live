<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCL HYD2 — Slides</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a12; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }

  /* the 1280x720 stage, scaled to fit the window */
  #stage {
    position: absolute; top: 50%; left: 50%;
    width: 1280px; height: 720px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    transform-origin: center center;
    box-shadow: 0 30px 90px rgba(0,0,0,0.6);
  }
  #frame { width: 1280px; height: 720px; border: 0; display: block; background: #16162b; }

  /* edge click zones for tap-to-advance */
  .zone { position: fixed; top: 0; height: 100%; width: 22%; z-index: 5; cursor: pointer; }
  .zone.left  { left: 0; }
  .zone.right { right: 0; }

  /* on-screen controls */
  .nav { position: fixed; z-index: 10; bottom: 22px; left: 50%; transform: translateX(-50%);
         display: flex; align-items: center; gap: 14px;
         background: rgba(20,20,34,0.78); border: 1px solid rgba(196,130,95,0.25);
         border-radius: 999px; padding: 8px 14px; backdrop-filter: blur(6px);
         opacity: 0; transition: opacity .25s; }
  body:hover .nav { opacity: 1; }
  .btn { appearance: none; border: 0; background: rgba(255,255,255,0.06); color: #e8e4dd;
         width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer;
         display: flex; align-items: center; justify-content: center; line-height: 1; }
  .btn:hover { background: rgba(196,130,95,0.35); }
  .counter { color: #d4d0c8; font-size: 13px; letter-spacing: .5px; min-width: 96px; text-align: center; }
  .counter b { color: #c4825f; }
  .name { color: #a8a4a0; font-size: 12px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .hint { position: fixed; z-index: 10; top: 16px; right: 18px; color: rgba(168,164,160,0.5);
          font-size: 12px; opacity: 0; transition: opacity .25s; }
  body:hover .hint { opacity: 1; }
</style>
</head>
<body>
  <div class="zone left"  onclick="prev()"></div>
  <div class="zone right" onclick="next()"></div>

  <div id="stage"><iframe id="frame" src="title.html" title="slide"></iframe></div>

  <div class="hint">← →  navigate &nbsp;·&nbsp; F  fullscreen</div>
  <div class="nav">
    <button class="btn" onclick="prev()" aria-label="Previous">‹</button>
    <span class="counter"><b id="cur">1</b> / <span id="total">1</span></span>
    <button class="btn" onclick="next()" aria-label="Next">›</button>
    <button class="btn" onclick="toggleFs()" aria-label="Fullscreen" title="Fullscreen">⛶</button>
  </div>

<script>
  const slides = [
    { file: 'title.html',                name: 'Title — CCCL HYD2 · AI for Leaders' },
    { file: 'vikram_pawar.html',         name: 'Host — Vikram Pawar' },
    { file: 'ambassador_programme.html', name: 'Ambassador Programme' },
    { file: 'uk_ambassadors.html',       name: 'UK Ambassadors' },
  ];

  let i = 0;
  const frame = document.getElementById('frame');
  const cur = document.getElementById('cur');
  const stage = document.getElementById('stage');
  document.getElementById('total').textContent = slides.length;

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    frame.src = slides[i].file;
    cur.textContent = i + 1;
    document.querySelector('.name')?.remove();
    const tag = document.createElement('span');
    tag.className = 'name'; tag.textContent = slides[i].name;
    document.querySelector('.nav').appendChild(tag);
    location.hash = i + 1;                 // deep-linkable: #2 opens slide 2
  }
  function next() { show(i + 1); }
  function prev() { show(i - 1); }

  function fit() {
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    stage.style.setProperty('--s', s);
  }
  function toggleFs() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  window.addEventListener('keydown', (e) => {
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key))    { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End')  show(slides.length - 1);
    else if (e.key.toLowerCase() === 'f') toggleFs();
  });
  window.addEventListener('resize', fit);

  // start on the slide named in the URL hash (#3), else slide 1
  const start = parseInt(location.hash.replace('#', ''), 10);
  fit();
  show(Number.isFinite(start) && start >= 1 ? start - 1 : 0);
</script>
</body>
</html>
