<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Thank You — CCCL BLR #6</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Georgia&family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e0e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .slide { width: 1280px; height: 720px; background: linear-gradient(150deg, #1a1a2e 0%, #16162b 60%, #1c1c30 100%); position: relative; overflow: hidden; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; }
  .watermark { position: absolute; right: -20px; bottom: 50px; font-family: Georgia, serif; font-weight: 700; font-size: 280px; line-height: 1; pointer-events: none; z-index: 0; user-select: none; }
  .watermark .cc { color: rgba(196,130,95,0.05); }
  .watermark .cl { color: rgba(232,228,221,0.04); }
  .content { position: relative; z-index: 1; padding: 36px 80px 0; display: flex; flex-direction: column; flex: 1; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .cccl-display { display: flex; flex-direction: column; }
  .cccl-word-lg { font-family: Georgia, serif; font-weight: 700; font-size: 52px; line-height: 1; }
  .cccl-word-lg .cc { color: #c4825f; }
  .cccl-word-lg .cl { color: #e8e4dd; }
  .cccl-underline { width: 100%; height: 2px; background: linear-gradient(90deg, #c4825f, rgba(196,130,95,0.1)); margin-top: 6px; border-radius: 1px; }
  .cccl-sub { font-size: 11px; letter-spacing: 2.5px; color: #a8a4a0; text-transform: uppercase; margin-top: 8px; }
  .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .title { font-family: Georgia, serif; font-size: 56px; font-weight: 700; color: #e8e4dd; }
  .subtitle { font-size: 18px; color: #a8a4a0; margin-bottom: 8px; }
  .qr-box { width: 200px; height: 200px; background: rgba(255,255,255,0.05); border: 1px solid rgba(196,130,95,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .qr-box img { width: 100%; height: 100%; }
  .qr-url { font-size: 18px; font-weight: 600; color: #c4825f; letter-spacing: 1px; }
  .footer-band { background: #13131f; border-top: 1px solid rgba(196,130,95,0.2); height: 60px; display: flex; align-items: center; padding: 0 80px; justify-content: space-between; flex-shrink: 0; }
  .footer-left { display: flex; align-items: center; gap: 14px; }
  .cccl-logo { height: 38px; opacity: 0.85; }
  .event-label { font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: #a8a4a0; }
  .event-label span { color: #c4825f; }
  .url { font-size: 12px; color: #a8a4a0; }
</style>
</head>
<body>
<div class="slide">
  <div class="watermark"><span class="cc">CC</span><span class="cl">CL</span></div>
  <div class="content">
    <div class="top-row">
      <div class="cccl-display">
        <div class="cccl-word-lg"><span class="cc">CC</span><span class="cl">CL</span></div>
        <div class="cccl-underline"></div>
        <div class="cccl-sub">Claude Code Meetups · In Your City</div>
      </div>
    </div>
    <div class="body">
      <div class="title">Thank You!</div>
      <div class="subtitle">Stay connected with the community</div>
      <div class="qr-box"><img src="qr/community_web.png" alt="QR" /></div>
      <div class="qr-url">cccl.ai</div>
    </div>
  </div>
  <div class="footer-band">
    <div class="footer-left">
      <img class="cccl-logo" src="cccl-badge-dark.svg" alt="CCCL" />
      <div class="event-label"><span>CCCL BLR #6</span> — Securing AI Agents</div>
    </div>
    <div class="url">12 Jul 2026 · Bengaluru &nbsp;·&nbsp; cccl.ai</div>
  </div>
</div>
</body>
</html>
